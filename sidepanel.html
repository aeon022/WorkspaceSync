<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DeckMirror</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-title-wrap">
      <img src="icons/icon-32.png" alt="DeckMirror Icon" class="brand-icon">
      <span class="brand-title">DeckMirror</span>
      <span class="brand-badge">PULSAR</span>
    </div>
    <div class="header-actions">
      <button id="syncNowBtn" class="btn-header" title="Sync now">
        <span id="syncIcon">🔄</span> Sync
      </button>
      <button id="optionsBtn" class="btn-header" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- Search Filter Input -->
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="tabSearchInput" class="search-input" placeholder="Filter tabs or workspaces..." autocomplete="off">
    <button id="searchClearBtn" class="search-clear" title="Clear">✕</button>
  </div>

  <!-- Status / Permission Warning Banner -->
  <div id="folderBanner" class="banner"></div>

  <!-- This Device Section -->
  <div class="section-title">
    <span>This device's workspaces</span>
    <span id="localTabTotal" class="count-pill">0 tabs</span>
  </div>
  <div id="localWorkspaces">Loading…</div>

  <!-- Other Devices Section -->
  <div class="section-title">
    <span>Other devices</span>
    <span id="remoteDeviceCount" class="count-pill">0 devices</span>
  </div>
  <div id="remoteDevices">Loading…</div>

  <!-- Support Footer -->
  <div class="support-card">
    <div style="font-size:11px; color:var(--fg-secondary);">DeckMirror is free & privacy-first.</div>
    <a class="support-btn" href="https://buy.polar.sh/polar_cl_DrOMaecRuEdvn8seYYegzMt0jEDbuY92X4zMd2NkGD8" target="_blank">
      ☕ Support on Polar
    </a>
  </div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
